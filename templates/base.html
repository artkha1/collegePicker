<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>College Picker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script src="https://kit.fontawesome.com/3276208b29.js" crossorigin="anonymous"></script>
    <style>
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
        .hero-body {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .container {
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }
    </style>
    
</head>

<body>
<div class="hero is-fullheight" style="background-color:#C4FCEF; overflow-x: hidden; max-width: 100vw;">

    <div class="hero-head">
        <nav class="navbar" role="navigation" aria-label="main navigation">
            <div class="container">
                <div class="navbar-brand">
                    <a href="{{ url_for('main.index') }}" class="navbar-item has-text-weight-bold">
                        College Picker
                    </a>
                    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                    </a>
                </div>
                <div id="navbarMenu" class="navbar-menu">
                    <div class="navbar-end">
                        <a href="{{ url_for('search.index') }}" class="navbar-item">Search</a>
                        <a href="{{ url_for('main.getStarted') }}" class="navbar-item">Get Started</a>
                        {% if current_user.is_authenticated %}
                            <a href="{{ url_for('auth.logout') }}" class="navbar-item">Logout</a>
                        {% else %}
                            <a href="{{ url_for('main.index') }}" class="navbar-item">Home</a>
                            <a href="{{ url_for('auth.login') }}" class="navbar-item">Login</a>
                            <a href="{{ url_for('auth.signup') }}" class="navbar-item">Sign Up</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <div class="hero-body">
        <div class="container"> <!-- can add has-text-centered for all other templates to have stuff centered-->
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const burger = document.querySelector('.navbar-burger');
        const menu = document.getElementById(burger?.dataset.target);
        if (burger && menu) {
            burger.addEventListener('click', () => {
                burger.classList.toggle('is-active');
                menu.classList.toggle('is-active');
            });
        }
    });
</script>
</body>

</html>
